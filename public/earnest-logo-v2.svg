<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for icon context -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#e5e5e5" stroke-width="1" opacity="0.3"/>
  
  <!-- Bold geometric E -->
  <g id="e-letter">
    <!-- Left vertical stroke -->
    <rect x="45" y="50" width="12" height="100" fill="#000" rx="2"/>
    
    <!-- Top horizontal -->
    <rect x="45" y="50" width="55" height="12" fill="#000" rx="2"/>
    
    <!-- Middle horizontal -->
    <rect x="45" y="93" width="48" height="12" fill="#000" rx="2"/>
    
    <!-- Bottom horizontal -->
    <rect x="45" y="138" width="55" height="12" fill="#000" rx="2"/>
  </g>
  
  <!-- Upward arrow piercing through -->
  <g id="arrow" transform="translate(95, 65)">
    <!-- Arrow shaft -->
    <rect x="-4" y="0" width="8" height="55" fill="#D4A574"/>
    
    <!-- Arrow head - left point -->
    <polygon points="0,-8 -12,8 -6,8" fill="#D4A574"/>
    
    <!-- Arrow head - right point -->
    <polygon points="0,-8 12,8 6,8" fill="#D4A574"/>
  </g>
  
  <!-- Optional: subtle glow effect on arrow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>